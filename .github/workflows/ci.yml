name: CI

# CI workflow for Hyperprompt Swift compiler
# Triggers on PR, push to main, and manual dispatch
# Runs on Linux (ubuntu-latest) with Swift 6.2.0

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions for GitHub Actions
# Restricts token scope to minimize potential blast radius if workflow is compromised
# Reference: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: CI - Build and Test
    # Linux-only CI job (macOS/Windows deferred to future tasks)
    # Uses the Swift 6.2.0 toolchain required by Package.swift
    # Caches dependencies based on Package.resolved hash
    runs-on: ubuntu-latest

    steps:
      # Validate secrets configuration (fail fast on missing required secrets)
      # Currently: No required secrets for baseline CI
      # Optional: CI_TOKEN (placeholder for future stages like artifact publishing)
      # Uncomment and update this block if secrets become required
      - name: Validate secrets
        run: |
          echo "Checking required secrets..."
          # No required secrets at this stage
          echo "✓ Secrets validation passed"

      # Clone repository with full git history
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release metadata
        run: python3 .github/scripts/check-release-metadata.py

      # Install Swift 6.2.0 toolchain
      # Version pinned per CI-01 audit findings
      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      # Verify Swift installation
      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      # Cache .build and .swiftpm for 60-80% speedup on subsequent runs
      # Cache key includes Package.resolved hash for deterministic invalidation
      - name: Cache Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Resolve Swift Package Manager dependencies
      - name: Resolve dependencies
        run: |
          echo "Resolving Swift dependencies..."
          swift package resolve
          echo "Dependencies resolved successfully"

      # Display cache statistics for debugging
      - name: Cache statistics
        if: always()
        run: |
          echo "Build directory size:"
          du -sh .build 2>/dev/null || echo "No .build directory yet"
          echo "SwiftPM cache size:"
          du -sh .swiftpm 2>/dev/null || echo "No .swiftpm directory yet"

      # Build the Swift package
      - name: Build
        run: |
          echo "Building Swift package..."
          swift build --build-tests
          echo "Build completed successfully"

      # Run tests with parallel execution
      - name: Run tests
        run: |
          echo "Running Swift tests..."
          swift test --parallel
          echo "Tests completed successfully"

      # Upload test results and build artifacts on failure
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: |
            .build/debug/*.xctest
            .build/**/*.swiftmodule
            .build/debug.yaml
          retention-days: 7
          if-no-files-found: warn

      # Display build summary
      - name: Build summary
        if: always()
        run: |
          echo "================================"
          echo "Build and Test Summary"
          echo "================================"
          echo "Build artifacts:"
          ls -lh .build/debug/ 2>/dev/null || echo "No build artifacts"
          echo "================================"

  build-without-editor-trait:
    name: CI - Build without Editor trait
    # Validate that default builds exclude EditorEngine when no traits are enabled.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Cache Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: |
          echo "Resolving Swift dependencies..."
          swift package resolve
          echo "Dependencies resolved successfully"

      - name: Build without EditorEngine trait
        env:
          SWIFT_PACKAGE_TRAITS: ""
          SWIFT_ENABLE_ALL_TRAITS: "0"
        run: |
          echo "Building Swift package without EditorEngine trait..."
          swift build --build-tests
          echo "Build completed successfully"

  build-with-editor-trait:
    name: CI - Build with Editor trait
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Cache Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-editor
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: |
          echo "Resolving Swift dependencies..."
          swift package resolve
          echo "Dependencies resolved successfully"

      - name: Run tests (Editor trait)
        run: |
          echo "Running Swift tests with Editor trait..."
          swift test --traits Editor
          echo "Tests completed successfully"

  linux-binary-artifact:
    name: CI - Linux Binary Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Cache Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      - name: Build release hyperprompt binary
        run: swift build -c release --product hyperprompt --static-swift-stdlib

      - name: Package Linux binary artifact
        run: |
          set -euo pipefail
          binary=".build/release/hyperprompt"
          test -x "$binary"
          compiler_version="$("$binary" --version)"
          expected_version="$(python3 .github/scripts/check-release-metadata.py --print-version)"
          test "$compiler_version" = "$expected_version"
          "$binary" --help >/dev/null
          mkdir -p dist/hyperprompt-linux-amd64
          install -m 0755 "$binary" dist/hyperprompt-linux-amd64/hyperprompt
          cat > dist/hyperprompt-linux-amd64/hyperprompt-artifact.json <<JSON
          {
            "artifact_kind": "hyperprompt_linux_binary",
            "schema_version": 1,
            "binary": "hyperprompt",
            "compiler_version": "${compiler_version}",
            "os": "linux",
            "arch": "amd64",
            "linkage": "static-swift-stdlib",
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${GITHUB_SHA}",
            "source_ref": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          JSON

      - name: Validate Linux binary artifact metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          artifact_dir = Path("dist/hyperprompt-linux-amd64")
          files = sorted(path.name for path in artifact_dir.iterdir())
          expected_files = ["hyperprompt", "hyperprompt-artifact.json"]
          if files != expected_files:
              raise SystemExit(f"Unexpected artifact files: {files!r}")

          metadata = json.loads((artifact_dir / "hyperprompt-artifact.json").read_text(encoding="utf-8"))
          version_source = Path("Sources/Core/HyperpromptVersion.swift").read_text(
              encoding="utf-8"
          )
          version_match = re.search(
              r'public static let current = "([^"]+)"',
              version_source,
          )
          if version_match is None:
              raise SystemExit("HyperpromptVersion.current is missing")

          expected = {
              "artifact_kind": "hyperprompt_linux_binary",
              "schema_version": 1,
              "binary": "hyperprompt",
              "compiler_version": version_match.group(1),
              "os": "linux",
              "arch": "amd64",
              "linkage": "static-swift-stdlib",
              "source_repository": "0al-spec/Hyperprompt",
          }
          for key, value in expected.items():
              actual = metadata.get(key)
              if actual != value:
                  raise SystemExit(f"{key} must be {value!r}; got {actual!r}")
          for key in ["source_commit", "source_ref", "workflow_run_id"]:
              value = metadata.get(key)
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"{key} must be a non-empty string")
          PY

      - name: Verify artifact in SpecSpace API base image
        run: |
          docker run --rm \
            --volume "$PWD/dist/hyperprompt-linux-amd64:/hp:ro" \
            python:3.11-slim \
            /hp/hyperprompt --version

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperprompt-linux-amd64
          path: dist/hyperprompt-linux-amd64
          retention-days: 30
          if-no-files-found: error

  vscode-extension-tests:
    name: CI - VS Code Extension Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Tools/VSCodeExtension/package-lock.json

      - name: Install dependencies
        working-directory: Tools/VSCodeExtension
        run: npm ci

      - name: Lint
        working-directory: Tools/VSCodeExtension
        run: npm run lint

      - name: Compile
        working-directory: Tools/VSCodeExtension
        run: npm run compile

      - name: Install Xvfb + D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11

      - name: Run extension tests
        working-directory: Tools/VSCodeExtension
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          XVFB_PID=$!
          export DISPLAY=:99
          export DBUS_SESSION_BUS_ADDRESS=
          export VSCODE_DISABLE_CRASH_REPORTER=1
          export VSCODE_DISABLE_UPDATE=1
          trap "kill ${XVFB_PID}" EXIT
          dbus-run-session -- npm test

      - name: Package extension (VSIX verification)
        working-directory: Tools/VSCodeExtension
        run: |
          npm install -g @vscode/vsce
          vsce package

      - name: Upload VSIX artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hyperprompt-vsix-${{ github.run_id }}
          path: Tools/VSCodeExtension/*.vsix
          retention-days: 7

  build-no-cache:
    name: CI - Build without cache (from scratch)
    # Validate that the project builds from scratch without cached dependencies.
    # This ensures reproducible builds and catches cache-related issues.
    # Only runs on pull requests when code, tests, or configuration changes.
    # Complements the cached build job to ensure both scenarios work.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate secrets
        run: |
          echo "Checking required secrets..."
          # No required secrets at this stage
          echo "✓ Secrets validation passed"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      # IMPORTANT: NO cache step - intentionally build from scratch
      # This validates that Package.resolved is complete and reproducible

      - name: Resolve dependencies (no cache)
        run: |
          echo "================================"
          echo "Resolving dependencies from scratch"
          echo "================================"
          echo "Starting at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          swift package resolve
          echo "Dependencies resolved successfully"

      - name: Build from scratch
        run: |
          echo "================================"
          echo "Building from scratch (no cache)"
          echo "================================"
          echo "Starting build at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          START_TIME=$(date +%s)

          swift build --build-tests

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Build completed in: ${DURATION}s"
          echo "================================"

      - name: Run tests (no cache)
        run: |
          echo "Running tests (no cache)..."
          swift test --parallel
          echo "Tests completed successfully"

      - name: Verify build artifacts
        if: always()
        run: |
          echo "================================"
          echo "Build Artifacts Verification"
          echo "================================"
          echo "Build directory size:"
          du -sh .build 2>/dev/null || echo "No .build directory"
          echo ""
          echo "SwiftPM checkout size:"
          du -sh .build/checkouts 2>/dev/null || echo "No checkouts"
          echo ""
          echo "Executables:"
          find .build -type f -executable -name "hyperprompt" 2>/dev/null || echo "No executables found"
          echo ""
          echo "Test bundles:"
          find .build -type d -name "*.xctest" 2>/dev/null || echo "No test bundles found"
          echo "================================"

      - name: Build summary
        if: always()
        run: |
          echo "================================"
          echo "No-Cache Build Summary"
          echo "================================"
          if [ -d ".build/debug" ]; then
            echo "✓ Build succeeded from scratch"
            echo "Build artifacts:"
            ls -lh .build/debug/ 2>/dev/null | head -20 || echo "No artifacts"
          else
            echo "✗ Build failed - no artifacts generated"
          fi
          echo "================================"

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: no-cache-build-failure-${{ github.run_id }}
          path: |
            .build/debug/*.xctest
            .build/**/*.swiftmodule
            .build/debug.yaml
          retention-days: 7
          if-no-files-found: warn
