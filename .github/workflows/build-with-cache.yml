name: Build with Cache

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'DOCS/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-without-editor-trait:
    name: Cached Build - Default traits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Swift dependencies
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Build
        run: |
          if [ "${{ steps.cache-spm.outputs.cache-hit }}" == "true" ]; then
            echo "✓ Using cached dependencies"
          else
            echo "Building from scratch (no cache)"
          fi
          time swift build

      - name: Run tests
        run: swift test

      - name: Show cache statistics
        run: |
          echo "=== Build Cache Statistics ==="
          echo "Cache hit: ${{ steps.cache-spm.outputs.cache-hit }}"
          echo "Build directory size: $(du -sh .build | cut -f1)"
          echo "Dependency count: $(ls .build/checkouts | wc -l)"
          echo ""
          echo "Build artifacts:"
          ls -lh .build/checkouts/

  build-with-editor-trait:
    name: Cached Build - Editor trait
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Swift dependencies
        id: cache-spm
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Package.swift') }}-editor
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-
            ${{ runner.os }}-spm-

      - name: Install Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.0'

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Build (Editor trait)
        run: |
          if [ "${{ steps.cache-spm.outputs.cache-hit }}" == "true" ]; then
            echo "✓ Using cached dependencies"
          else
            echo "Building from scratch (no cache)"
          fi
          time swift build --traits Editor

      - name: Run tests (Editor trait)
        run: swift test --traits Editor

      - name: Show cache statistics
        run: |
          echo "=== Build Cache Statistics ==="
          echo "Cache hit: ${{ steps.cache-spm.outputs.cache-hit }}"
          echo "Build directory size: $(du -sh .build | cut -f1)"
          echo "Dependency count: $(ls .build/checkouts | wc -l)"
          echo ""
          echo "Build artifacts:"
          ls -lh .build/checkouts/
